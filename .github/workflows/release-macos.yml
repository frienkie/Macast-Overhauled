name: Build macOS release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-macos.yml, tools/build_macos.sh, tools/prepare_distribution.py, macast/.version, README.md, README_ZH.md, RELEASE_NOTES.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install python@3.12 mpv dylibbundler create-dmg gettext
      - name: Install Python dependencies
        run: |
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv .venv
          .venv/bin/python -m pip install -r requirements/darwin.txt
          .venv/bin/python -m pip install 'setuptools<81' 'py2app>=0.28.8,<0.29'
      - name: Build signed app and DMG
        run: |
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          PYTHON="$PWD/.venv/bin/python" MACAST_SKIP_SMOKE=1 bash tools/build_macos.sh
          version="$(tr -d '\r\n' < macast/.version)"
          asset="Macast-MacOS-v${version}-arm64.dmg"
          hdiutil verify "$asset"
          shasum -a 256 "$asset" > "${asset}.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < macast/.version)"
          tag="v${version}"
          asset="Macast-MacOS-v${version}-arm64.dmg"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "${asset}.sha256" --clobber
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" "$asset" "${asset}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Macast-Overhauled ${tag} for macOS (arm64)" \
              --notes-file RELEASE_NOTES.md
          fi
