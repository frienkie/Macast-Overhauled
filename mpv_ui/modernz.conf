# Macast: a restrained ModernZ preset, no video shaders or thumbnail workers.
language=default
layout=default
icon_theme=fluent
icon_style=mixed
audio_tracks_button=no
ontop_button=no
font=sans-serif
idlescreen=no
window_top_bar=no
window_controls=no
vidscale=no
scalewindowed=1.15
scalefullscreen=1.25
macast_adaptive_scale=yes
macast_ui_scale=1.0
show_title=yes
title=${title}
title_font_size=22
time_font_size=18
tooltip_font_size=16
speed_font_size=18
playpause_size=32
midbuttons_size=26
sidebuttons_size=26
osc_height=72
seekbar_height=large
seekbarfg_color=#76AAFF
seek_handle_color=#76AAFF
seek_handle_border_color=#D7E7FF
hover_effect_color=#A4C7FF
nibble_color=#76AAFF
osc_color=#101722
hover_effect=color
hidetimeout=1800
fadeduration=120
fadein=no
tick_delay=0.0333333333
tick_delay_follow_display_fps=no
persistent_progress=no
cache_info=no
download_button=no
screenshot_button=no
loop_button=no
shuffle_button=no
hide_empty_playlist_button=yes
sub_margins=no
osd_margins=no
truncate_title=yes
